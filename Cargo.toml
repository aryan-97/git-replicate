[package]
name = "git-replicate"
version = "1.2.0"
edition = "2024"
description = "Copy selected Git branch pushes from a primary remote to mirror remotes"
authors = ["Aryan Agarwal (@aryan-97) <aryanagarwal@outlook.in>"]
license = "Apache-2.0"
homepage = "https://aryanagarwal.dev"
repository = "https://github.com/aryan-97/git-replicate"
readme = "README.md"
keywords = ["git", "mirror", "replicate", "push", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = { version = "8.0.1", default-features = false }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
